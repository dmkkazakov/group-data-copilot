[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "group-data-copilot"
version = "0.1.0"
description = "Agentic workflow for collecting and structuring corporate group data"
authors = [{ name = "Dmitry Kazakov" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "networkx>=3.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
group-data-copilot = "group_data_copilot.cli:main"

[tool.setuptools.packages.find]
include = ["group_data_copilot*"]
